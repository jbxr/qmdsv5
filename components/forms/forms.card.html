<!-- @dsCard group="Components" viewport="700x520" name="Forms" subtitle="Inset fields, editable controls, addressed prompts, density switch, tabs, the one picker" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>html,body{margin:0;background:var(--qm-surface-app);font-family:var(--qm-font-sans);color:var(--qm-text-3)}*{box-sizing:border-box}.wrap{padding:16px 18px;display:flex;flex-direction:column;gap:14px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.lbl{font-family:var(--qm-font-mono);font-size:11px;letter-spacing:.14em;color:var(--qm-text-7)}</style>
</head><body><div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const QM = window.QuantumMateriaDesignSystem_488cde;
const { Field, TextField, TextArea, PromptField, PromptTextField, SegmentedControl, Tabs, Picker, Avatar } = QM;
// TextField, TextArea and PromptTextField are newer than the compiled bundle
// this card loads. Until _ds_bundle.js is regenerated they are undefined, and
// rendering them would blank the whole card rather than just this section.
const EDITABLE_READY = Boolean(TextField && TextArea && PromptTextField);
function Demo() {
  const [d, setD] = React.useState('Comfortable');
  const [t, setT] = React.useState('Details');
  const [title, setTitle] = React.useState('Vera & Cade — the corridor');
  const [note, setNote] = React.useState('');
  const [ask, setAsk] = React.useState('');
  return (
    <div className="wrap">
      <div className="lbl">PRESENTATIONAL — A VALUE IN A WELL</div>
      <div style={{ display: 'grid', gridTemplateColumns: '1.4fr 92px 92px', gap: 12, alignItems: 'end' }}>
        <Field label="Title" kind="serif" value="Vera &amp; Cade — the corridor" />
        <Field label="Y" kind="mono" value="−6" size="sm" />
        <Field label="D" kind="mono" value="1" size="sm" focused />
      </div>
      <div className="row" style={{ gap: 12 }}>
        <Field label="What happened" value="occurs" select style={{ flex: 1 }} />
        <Field label="Subject" placeholder="— none —" select style={{ flex: 1 }} />
      </div>
      <div className="lbl">EDITABLE — THE RING IS THE WELL'S OWN, NO FOCUS PROP</div>
      {EDITABLE_READY ? (
        <React.Fragment>
          <div style={{ display: 'grid', gridTemplateColumns: '1.4fr 92px 92px', gap: 12, alignItems: 'end' }}>
            <TextField label="Title" kind="serif" value={title} onChange={(e) => setTitle(e.target.value)} />
            <TextField label="Y" kind="mono" size="sm" placeholder="−6" />
            <TextField label="D" kind="mono" size="sm" defaultValue="1" />
          </div>
          <div className="row" style={{ gap: 12, alignItems: 'flex-start' }}>
            <TextArea label="Logline" kind="serif" hint={`${note.length} / 240`} rows={2}
              placeholder="what this scene is really about…"
              value={note} onChange={(e) => setNote(e.target.value)} style={{ flex: 1 }} />
            <Field label="Search" style={{ flex: 1 }}>
              <input className="qm-control" placeholder="any control, unaided" style={{ flex: 1, minWidth: 0, background: 'transparent', border: 0, outline: 'none', font: 'inherit', color: 'inherit' }} />
            </Field>
          </div>
        </React.Fragment>
      ) : (
        <div style={{ fontSize: 12.5, lineHeight: 1.55, color: 'var(--qm-text-6)', padding: '10px 12px', borderRadius: 'var(--qm-radius-control)', background: 'var(--qm-fill-quiet)', border: '1px dashed var(--qm-border-dashed)' }}>
          <code style={{ fontFamily: 'var(--qm-font-mono)' }}>TextField</code>, <code style={{ fontFamily: 'var(--qm-font-mono)' }}>TextArea</code>, <code style={{ fontFamily: 'var(--qm-font-mono)' }}>PromptTextField</code> and
          the self-lighting ring on <code style={{ fontFamily: 'var(--qm-font-mono)' }}>Field</code> and <code style={{ fontFamily: 'var(--qm-font-mono)' }}>PromptField</code> ship in <code style={{ fontFamily: 'var(--qm-font-mono)' }}>components/forms/</code> but
          are newer than this card's compiled bundle. Regenerate <code style={{ fontFamily: 'var(--qm-font-mono)' }}>_ds_bundle.js</code> to see this section and the addressed row below it.
        </div>
      )}
      <div className="lbl">ADDRESSED — THE BORDER SAYS WHO WILL HEAR IT</div>
      <div className="row" style={{ gap: 10 }}>
        <PromptField audience="character" placeholder="ask vera…" caret style={{ flex: 1 }} />
        <PromptField audience="direction" placeholder="private note for vera's next turn…" hintKey="stage-direct" style={{ flex: 1 }} />
      </div>
      {EDITABLE_READY ? (
        <div className="row" style={{ gap: 10 }}>
          <PromptTextField audience="character" aria-label="ask vera" placeholder="ask vera…"
            value={ask} onChange={(e) => setAsk(e.target.value)} style={{ flex: 1 }} />
          <PromptTextField audience="scene" aria-label="say this in scene" placeholder="say this in scene…" hintKey="in scene" style={{ flex: 1 }} />
        </div>
      ) : null}
      <div className="row" style={{ gap: 20 }}>
        <SegmentedControl value={d} onChange={setD} options={['Comfortable', 'Compact', { value: 'Focus', label: 'Focus', outline: true }]} />
        <Tabs tabs={['Details', 'Character', 'Consult', 'History']} value={t} onChange={setT} />
      </div>
      <div className="row" style={{ gap: 16, alignItems: 'flex-start' }}>
        <Picker width={300} query="[Y-40"
          items={[
            { label: '[Y−40]', meta: 'as typed · canonicalised', mono: true, color: 'var(--qm-coral-text)', active: true },
            { label: '[Y35.100]', meta: 'document anchor', mono: true },
            { label: '[Y0]', meta: 'room clock', mono: true },
            { label: '[Y−6]', meta: 'already used · 8×', mono: true, color: 'var(--qm-text-3)', separated: true }
          ]} />
        <Picker width={300} query="@sari"
          items={[
            { label: 'Sarita Fernandes', meta: 'character', leading: <Avatar initials="SF" size={24} />, active: true, trailingRight: true },
            { label: 'Luna Station', meta: 'location', leading: <Avatar initials="LS" kind="location" size={24} />, trailingRight: true },
            { label: 'The Chrysalis', meta: 'artifact', leading: <Avatar initials="CH" kind="artifact" size={24} />, trailingRight: true }
          ]}
          footer="Accepting inserts the canonical label, never the alias." />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
