<!-- @dsCard group="Story Engine" viewport="1440x900" name="QM Story Engine" subtitle="Writing room → new scene → the room → compose → outline, click-through" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>QM Story Engine — UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
html,body{margin:0;height:100%;background:var(--qm-surface-app);font-family:var(--qm-font-sans);color:var(--qm-text-3)}
*{box-sizing:border-box}
#root{height:100%;display:flex;flex-direction:column}
.qm-scroll::-webkit-scrollbar{width:10px}
.qm-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:6px;border:3px solid transparent;background-clip:content-box}
.qm-scroll::-webkit-scrollbar-track{background:transparent}
.nav{flex:none;display:flex;align-items:center;gap:8px;padding:10px 18px;background:var(--qm-surface-status);border-bottom:1px solid var(--qm-border-structural)}
.nav b{font-family:var(--qm-font-mono);font-size:11px;letter-spacing:.16em;color:var(--qm-text-7);font-weight:400;margin-right:6px}
.stage{flex:1;min-height:0}
</style>
</head><body><div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="./data.jsx"></script>
<script type="text/babel" src="./WritingRoom.jsx"></script>
<script type="text/babel" src="./NewScene.jsx"></script>
<script type="text/babel" src="./SceneRoom.jsx"></script>
<script type="text/babel" src="./Compose.jsx"></script>
<script type="text/babel" src="./Outline.jsx"></script>
<script type="text/babel">
const ROUTES = [
  ['writing', 'Writing room'],
  ['new', 'New scene'],
  ['room', 'Scene room'],
  ['compose', 'Compose'],
  ['outline', 'Outline']
];

/**
 * A route swaps the stage in place and moves no document, so it is a button and
 * never an anchor — an `<a>` with no `href` is not a link at all: no tab stop,
 * no role, nothing to press. `Pressable` is the kit's own control element and
 * carries the ring; the rest is the pill the stylesheet used to draw.
 */
function RouteButton({ label, current, onClick }) {
  const [hover, setHover] = React.useState(false);
  return (
    <Pressable
      onClick={onClick}
      aria-current={current ? 'page' : undefined}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        // `Pressable` drops the UA font, colour and background but not these
        // two, and a pill drawn by the stylesheet had neither.
        textAlign: 'start', appearance: 'none', WebkitAppearance: 'none',
        height: 30, display: 'inline-flex', alignItems: 'center', padding: '0 12px',
        borderRadius: 'var(--qm-radius-control)', fontSize: 'var(--qm-type-label)',
        color: current ? 'var(--qm-text-1)' : hover ? 'var(--qm-text-2)' : 'var(--qm-text-4)',
        background: current ? 'var(--qm-surface-selected)' : hover ? 'var(--qm-fill-hover)' : 'transparent',
        borderWidth: 1, borderStyle: 'solid',
        borderColor: current ? 'rgba(255,255,255,.14)' : 'var(--qm-border-control-quiet)'
      }}
    >{label}</Pressable>
  );
}

function App() {
  const [route, setRoute] = React.useState('writing');
  const go = (r) => () => setRoute(r);
  const { WritingRoom, NewScene, SceneRoom, Compose, Outline } = window;
  return (
    <>
      <nav className="nav" aria-label="Story Engine routes">
        <b>QM STORY ENGINE</b>
        {ROUTES.map(([id, label]) => (
          <RouteButton key={id} label={label} current={route === id} onClick={go(id)} />
        ))}
        <span style={{ flex: 1 }} />
        <span style={{ fontSize: 12.5, color: 'var(--qm-text-7)' }}>Recreation of the v5 kit — every surface built from the design system's own components.</span>
      </nav>
      <div className="stage">
        {route === 'writing' ? <WritingRoom onOpenScene={go('room')} onNewScene={go('new')} onNewOutline={go('outline')} onCompose={go('compose')} onOpenOutline={go('outline')} /> : null}
        {route === 'new' ? <NewScene onBack={go('writing')} onEnter={go('room')} /> : null}
        {route === 'room' ? <SceneRoom onExit={go('writing')} /> : null}
        {route === 'compose' ? <Compose onExit={go('writing')} /> : null}
        {route === 'outline' ? <Outline onExit={go('writing')} /> : null}
      </div>
    </>
  );
}

function boot() {
  // `Pressable` is declared by the route files and shared, not redeclared here;
  // wait for it too, so the nav is never rendered without its control element.
  if (!window.WritingRoom || !window.Outline || !window.Pressable) return setTimeout(boot, 60);
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}
boot();
</script>
</body></html>
