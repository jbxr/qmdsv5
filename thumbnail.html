<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.tile{width:1280px;height:854px;display:flex}
.main{flex:1;background:var(--qm-surface-app);display:flex;align-items:center;justify-content:center}
.name{font-family:var(--qm-font-serif);font-size:118px;line-height:1;color:var(--qm-prose-1);letter-spacing:-0.01em;white-space:nowrap}
.strip{width:320px;display:flex;flex-direction:column}
.strip span{flex:1;display:block}</style>
</head><body>
<div class="tile">
  <div class="main"><div class="name">QuantumMateria</div></div>
  <div class="strip">
    <span style="background:#E8DCC0"></span>
    <span style="background:#E2A544"></span>
    <span style="background:#55B7A6"></span>
    <span style="background:#C4553A"></span>
  </div>
</div>
</body></html>
