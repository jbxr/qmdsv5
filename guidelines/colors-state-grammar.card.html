<!-- @dsCard group="Colors" viewport="700x240" name="State grammar" subtitle="Colour never travels alone — every state carries a shape, and only one of them is a fault" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--qm-surface-app);font-family:var(--qm-font-sans);color:var(--qm-text-3);font-size:13.5px}*{box-sizing:border-box}.w{padding:16px 18px}.g{display:grid;gap:10px}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.m{font-family:var(--qm-font-mono);font-size:12px;color:var(--qm-text-7)}.lbl{font-family:var(--qm-font-mono);font-size:11px;letter-spacing:.14em;color:var(--qm-text-7)}.sw{width:44px;height:44px;border-radius:8px;border:1px solid var(--qm-border-control-quiet);flex:none}.dot{width:9px;height:9px;flex:none;border-radius:50%}.chip{font-family:var(--qm-font-mono);font-size:12px;border-radius:4px;padding:3px 8px;display:inline-flex;align-items:center;gap:6px}</style>
</head><body><div class="w">
<div class="g" style="grid-template-columns:1fr 1fr;gap:12px 22px">
<div class="r" style="gap:12px"><span class="chip" style="color:var(--qm-teal-text-quiet);background:var(--qm-tint-teal);border:1px solid var(--qm-border-teal)"><span class="dot" style="width:8px;height:8px;background:#55B7A6"></span>CANONICAL</span><span style="color:var(--qm-text-4)">filled teal dot</span></div><div class="r" style="gap:12px"><span class="chip" style="color:var(--qm-gold-text);background:var(--qm-tint-gold);border:1px solid var(--qm-border-gold)"><span class="dot" style="width:8px;height:8px;background:transparent;border:1.5px solid #E2A544"></span>PROPOSED</span><span style="color:var(--qm-text-4)">hollow gold ring</span></div><div class="r" style="gap:12px"><span class="chip" style="color:var(--qm-violet-text);background:var(--qm-tint-violet);border:1px solid var(--qm-border-violet)"><span style="width:8px;height:8px;flex:none;background:#A292F2;transform:rotate(45deg)"></span>SUGGESTED</span><span style="color:var(--qm-text-4)">violet diamond</span></div><div class="r" style="gap:12px"><span class="chip" style="color:var(--qm-coral-text);background:var(--qm-tint-coral);border:1px solid var(--qm-border-coral)"><span class="dot" style="width:8px;height:8px;background:#F17B54"></span>HERE</span><span style="color:var(--qm-text-4)">coral pin flag</span></div><div class="r" style="gap:12px"><span class="chip" style="color:var(--qm-blue-text);background:var(--qm-tint-blue-soft);border:1px solid var(--qm-border-blue-soft)"><span class="dot" style="width:8px;height:8px;background:#5FA8BC"></span>CHARACTER</span><span style="color:var(--qm-text-4)">avatar or linked name</span></div><div class="r" style="gap:12px"><span class="chip" style="color:var(--qm-gold-text);background:var(--qm-tint-gold);border:1px dashed var(--qm-border-gold)"><span class="dot" style="width:8px;height:8px;background:transparent;border:1.5px dashed #E2A544"></span>UNLINKED</span><span style="color:var(--qm-text-4)">dashed gold ring — attention, never fault</span></div><div class="r" style="gap:12px"><span class="chip" style="color:var(--qm-text-6);background:transparent;border:1px solid var(--qm-border-control-quiet)"><span class="dot" style="width:8px;height:8px;background:transparent;border:1.5px solid #4E5967"></span>UNWRITTEN</span><span style="color:var(--qm-text-4)">hollow grey dot — absence, never fault</span></div><div class="r" style="gap:12px"><span class="chip" style="color:var(--qm-cinnabar-text);background:var(--qm-tint-cinnabar);border:1px solid var(--qm-border-cinnabar)"><span style="width:0;height:0;flex:none;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid #C4553A"></span>CONFLICT</span><span style="color:var(--qm-text-4)">cinnabar triangle — the only fault here</span></div>
</div></div></body></html>
