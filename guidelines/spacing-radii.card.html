<!-- @dsCard group="Spacing" viewport="700x140" name="Radii" subtitle="Four radii — chip, control, card, panel" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--qm-surface-app);font-family:var(--qm-font-sans);color:var(--qm-text-3);font-size:13.5px}*{box-sizing:border-box}.w{padding:16px 18px}.g{display:grid;gap:10px}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.m{font-family:var(--qm-font-mono);font-size:12px;color:var(--qm-text-7)}.lbl{font-family:var(--qm-font-mono);font-size:11px;letter-spacing:.14em;color:var(--qm-text-7)}.sw{width:44px;height:44px;border-radius:8px;border:1px solid var(--qm-border-control-quiet);flex:none}.dot{width:9px;height:9px;flex:none;border-radius:50%}.chip{font-family:var(--qm-font-mono);font-size:12px;border-radius:4px;padding:3px 8px;display:inline-flex;align-items:center;gap:6px}</style>
</head><body><div class="w">
<div class="r" style="gap:12px;align-items:flex-end">
<div style="text-align:center"><div style="width:56px;height:36px;border-radius:4px;background:rgba(255,255,255,0.07);border:1px solid var(--qm-border-control-quiet)"></div><div class="m" style="margin-top:6px;font-size:11px">4 chip</div></div><div style="text-align:center"><div style="width:56px;height:36px;border-radius:5px;background:rgba(255,255,255,0.07);border:1px solid var(--qm-border-control-quiet)"></div><div class="m" style="margin-top:6px;font-size:11px">5 key</div></div><div style="text-align:center"><div style="width:56px;height:36px;border-radius:7px;background:rgba(255,255,255,0.07);border:1px solid var(--qm-border-control-quiet)"></div><div class="m" style="margin-top:6px;font-size:11px">7 control</div></div><div style="text-align:center"><div style="width:56px;height:36px;border-radius:9px;background:rgba(255,255,255,0.07);border:1px solid var(--qm-border-control-quiet)"></div><div class="m" style="margin-top:6px;font-size:11px">9 card</div></div><div style="text-align:center"><div style="width:56px;height:36px;border-radius:12px;background:rgba(255,255,255,0.07);border:1px solid var(--qm-border-control-quiet)"></div><div class="m" style="margin-top:6px;font-size:11px">12 panel</div></div><div style="text-align:center"><div style="width:56px;height:36px;border-radius:16px;background:rgba(255,255,255,0.07);border:1px solid var(--qm-border-control-quiet)"></div><div class="m" style="margin-top:6px;font-size:11px">16 pill</div></div>
<div style="text-align:center"><div style="width:36px;height:36px;border-radius:50%;background:rgba(95,168,188,0.18);border:1px solid var(--qm-border-blue-strong)"></div><div class="m" style="margin-top:6px;font-size:11px">50% avatar</div></div>
</div>
<div style="margin-top:12px;color:var(--qm-text-6)">Nothing in QM is rounder than 12 except avatars and cast pills.</div></div></body></html>
