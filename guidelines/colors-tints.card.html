<!-- @dsCard group="Colors" viewport="700x150" name="Tints & accent borders" subtitle="12-20% tint, 28-45% border — the only way an accent fills a shape" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--qm-surface-app);font-family:var(--qm-font-sans);color:var(--qm-text-3);font-size:13.5px}*{box-sizing:border-box}.w{padding:16px 18px}.g{display:grid;gap:10px}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.m{font-family:var(--qm-font-mono);font-size:12px;color:var(--qm-text-7)}.lbl{font-family:var(--qm-font-mono);font-size:11px;letter-spacing:.14em;color:var(--qm-text-7)}.sw{width:44px;height:44px;border-radius:8px;border:1px solid var(--qm-border-control-quiet);flex:none}.dot{width:9px;height:9px;flex:none;border-radius:50%}.chip{font-family:var(--qm-font-mono);font-size:12px;border-radius:4px;padding:3px 8px;display:inline-flex;align-items:center;gap:6px}</style>
</head><body><div class="w">
<div class="r" style="gap:10px">

<div style="flex:1;padding:11px 12px;border-radius:7px;background:rgba(226,165,68,0.14);border:1px solid rgba(226,165,68,0.30);color:#EFD9AF"><div style="font-family:var(--qm-font-mono);font-size:12px">gold</div><div class="m" style="font-size:10.5px;margin-top:5px;color:inherit;opacity:.7">0.14 / 0.30</div></div>
<div style="flex:1;padding:11px 12px;border-radius:7px;background:rgba(85,183,166,0.14);border:1px solid rgba(85,183,166,0.32);color:#9FD8CD"><div style="font-family:var(--qm-font-mono);font-size:12px">teal</div><div class="m" style="font-size:10.5px;margin-top:5px;color:inherit;opacity:.7">0.14 / 0.32</div></div>
<div style="flex:1;padding:11px 12px;border-radius:7px;background:rgba(95,168,188,0.14);border:1px solid rgba(95,168,188,0.28);color:#8FCADB"><div style="font-family:var(--qm-font-mono);font-size:12px">blue</div><div class="m" style="font-size:10.5px;margin-top:5px;color:inherit;opacity:.7">0.14 / 0.28</div></div>
<div style="flex:1;padding:11px 12px;border-radius:7px;background:rgba(162,146,242,0.12);border:1px solid rgba(162,146,242,0.28);color:#C0AEF5"><div style="font-family:var(--qm-font-mono);font-size:12px">violet</div><div class="m" style="font-size:10.5px;margin-top:5px;color:inherit;opacity:.7">0.12 / 0.28</div></div>
<div style="flex:1;padding:11px 12px;border-radius:7px;background:rgba(241,123,84,0.16);border:1px solid rgba(241,123,84,0.30);color:#F4A98B"><div style="font-family:var(--qm-font-mono);font-size:12px">coral</div><div class="m" style="font-size:10.5px;margin-top:5px;color:inherit;opacity:.7">0.16 / 0.30</div></div>
<div style="flex:1;padding:11px 12px;border-radius:7px;background:rgba(196,85,58,0.14);border:1px solid rgba(196,85,58,0.30);color:#F0BFB1"><div style="font-family:var(--qm-font-mono);font-size:12px">cinnabar</div><div class="m" style="font-size:10.5px;margin-top:5px;color:inherit;opacity:.7">0.14 / 0.30</div></div>
</div>
<div style="margin-top:12px;color:var(--qm-text-6)">Solid accent fills are reserved for the one gold primary and the parchment in-scene action.</div></div></body></html>
