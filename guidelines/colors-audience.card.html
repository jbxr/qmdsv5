<!-- @dsCard group="Colors" viewport="700x190" name="Audience temperature" subtitle="The room is lit and warm; private is unlit, cool and dashed" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--qm-surface-app);font-family:var(--qm-font-sans);color:var(--qm-text-3);font-size:13.5px}*{box-sizing:border-box}.w{padding:16px 18px}.g{display:grid;gap:10px}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.m{font-family:var(--qm-font-mono);font-size:12px;color:var(--qm-text-7)}.lbl{font-family:var(--qm-font-mono);font-size:11px;letter-spacing:.14em;color:var(--qm-text-7)}.sw{width:44px;height:44px;border-radius:8px;border:1px solid var(--qm-border-control-quiet);flex:none}.dot{width:9px;height:9px;flex:none;border-radius:50%}.chip{font-family:var(--qm-font-mono);font-size:12px;border-radius:4px;padding:3px 8px;display:inline-flex;align-items:center;gap:6px}</style>
</head><body><div class="w">
<div class="r" style="gap:14px;align-items:stretch">
<div style="flex:1;border-radius:8px;overflow:hidden;border:1px solid rgba(232,220,192,0.18)">
  <div class="r" style="gap:9px;padding:11px 14px;background:linear-gradient(180deg,#241F18,#1E1A15)"><span class="dot" style="width:8px;height:8px;background:#E8DCC0;box-shadow:0 0 10px rgba(232,220,192,.6)"></span><span style="font-size:12.5px;font-weight:600;letter-spacing:.16em;color:#E8DCC0">IN SCENE</span><span style="color:#B9AC90">everyone hears this</span></div>
  <div style="padding:12px 14px;font-family:var(--qm-font-serif);font-size:15.5px;line-height:1.7;color:#E9E0CB"><b style="color:#F5EEE0">Cade</b> I am capable of movement. Stand back.</div>
</div>
<div style="flex:1;border-radius:8px;overflow:hidden;border:1px dashed rgba(255,255,255,0.16)">
  <div class="r" style="gap:9px;padding:11px 14px;background:#10161C"><span class="dot" style="width:8px;height:8px;background:transparent;border:1.5px solid #6E7987"></span><span style="font-size:12.5px;font-weight:600;letter-spacing:.16em;color:var(--qm-text-4)">PRIVATE</span><span style="color:var(--qm-text-7)">off-stage</span></div>
  <div style="padding:12px 14px;line-height:1.6;color:var(--qm-text-6)">Nothing here is witnessed until you send it.</div>
</div>
</div>
<div style="margin-top:12px;color:var(--qm-text-6);line-height:1.6">Audience is a surface, never another accent colour.</div></div></body></html>
