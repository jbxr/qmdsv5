<!-- @dsCard group="Brand" viewport="700x150" name="Brand mark" subtitle="A gradient tile and the QM wordmark — QM has no logotype" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--qm-surface-app);font-family:var(--qm-font-sans);color:var(--qm-text-3);font-size:13.5px}*{box-sizing:border-box}.w{padding:16px 18px}.g{display:grid;gap:10px}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.m{font-family:var(--qm-font-mono);font-size:12px;color:var(--qm-text-7)}.lbl{font-family:var(--qm-font-mono);font-size:11px;letter-spacing:.14em;color:var(--qm-text-7)}.sw{width:44px;height:44px;border-radius:8px;border:1px solid var(--qm-border-control-quiet);flex:none}.dot{width:9px;height:9px;flex:none;border-radius:50%}.chip{font-family:var(--qm-font-mono);font-size:12px;border-radius:4px;padding:3px 8px;display:inline-flex;align-items:center;gap:6px}</style>
</head><body><div class="w">
<div class="r" style="gap:18px">
<div class="r" style="gap:10px;padding:12px 16px;border-radius:8px;background:linear-gradient(180deg,#1A222C,#151C24);border:1px solid var(--qm-border-structural)">
<span style="width:24px;height:24px;border-radius:6px;background:linear-gradient(145deg,#4E8FA0,#2C4A5C);box-shadow:inset 0 1px 0 rgba(255,255,255,0.25)"></span>
<span style="font-size:15px;font-weight:600;letter-spacing:.02em;color:var(--qm-text-1)">QM</span>
<span style="font-size:15px;color:var(--qm-text-hairline)">/</span><span style="font-size:15px;color:var(--qm-text-row)">Outline</span>
</div>
<div style="flex:1;line-height:1.6;color:var(--qm-text-6);min-width:280px">The source kit ships no logo file. Wherever a mark belongs, QM sets the wordmark in Plex Sans 600 beside the 24px gradient tile (<span class="m" style="color:var(--qm-text-3)">assets/qm-mark.svg</span>). Do not draw a logotype.</div>
</div></div></body></html>
