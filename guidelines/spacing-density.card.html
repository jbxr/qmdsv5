<!-- @dsCard group="Spacing" viewport="700x380" name="Density transformation" subtitle="One token set, three readings — comfortable, compact, focus" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--qm-surface-app);font-family:var(--qm-font-sans);color:var(--qm-text-3);font-size:13.5px}*{box-sizing:border-box}.w{padding:16px 18px}.g{display:grid;gap:10px}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.m{font-family:var(--qm-font-mono);font-size:12px;color:var(--qm-text-7)}.lbl{font-family:var(--qm-font-mono);font-size:11px;letter-spacing:.14em;color:var(--qm-text-7)}.sw{width:44px;height:44px;border-radius:8px;border:1px solid var(--qm-border-control-quiet);flex:none}.dot{width:9px;height:9px;flex:none;border-radius:50%}.chip{font-family:var(--qm-font-mono);font-size:12px;border-radius:4px;padding:3px 8px;display:inline-flex;align-items:center;gap:6px}</style>
</head><body><div class="w">
<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:0 18px;padding-bottom:9px;border-bottom:1px solid var(--qm-border-panel)" class="lbl"><span>TOKEN</span><span>COMFORTABLE</span><span>COMPACT</span><span>FOCUS</span></div>

<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:0 18px;padding:11px 0;border-bottom:1px solid var(--qm-border-list)"><span class="m" style="color:var(--qm-text-3)">--qm-row-py</span><span class="m" style="font-size:12.5px">12px</span><span class="m" style="font-size:12.5px">8px</span><span class="m" style="font-size:12.5px;color:var(--qm-text-6)">12px</span></div>
<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:0 18px;padding:11px 0;border-bottom:1px solid var(--qm-border-list)"><span class="m" style="color:var(--qm-text-3)">--qm-beat-gap</span><span class="m" style="font-size:12.5px">16px</span><span class="m" style="font-size:12.5px">10px</span><span class="m" style="font-size:12.5px;color:var(--qm-text-6)">22px</span></div>
<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:0 18px;padding:11px 0;border-bottom:1px solid var(--qm-border-list)"><span class="m" style="color:var(--qm-text-3)">--qm-prose-size</span><span class="m" style="font-size:12.5px">18px</span><span class="m" style="font-size:12.5px">16px</span><span class="m" style="font-size:12.5px;color:var(--qm-text-6)">19px</span></div>
<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:0 18px;padding:11px 0;border-bottom:1px solid var(--qm-border-list)"><span class="m" style="color:var(--qm-text-3)">--qm-field-size</span><span class="m" style="font-size:12.5px">14.5px</span><span class="m" style="font-size:12.5px">13px</span><span class="m" style="font-size:12.5px;color:var(--qm-text-6)">14.5px</span></div>
<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:0 18px;padding:11px 0;border-bottom:1px solid var(--qm-border-list)"><span class="m" style="color:var(--qm-text-3)">--qm-col</span><span class="m" style="font-size:12.5px">820px</span><span class="m" style="font-size:12.5px">760px</span><span class="m" style="font-size:12.5px;color:var(--qm-text-6)">860px</span></div>
<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:0 18px;padding:11px 0;border-bottom:1px solid var(--qm-border-list)"><span class="m" style="color:var(--qm-text-3)">--qm-insp-w</span><span class="m" style="font-size:12.5px">404px</span><span class="m" style="font-size:12.5px">332px</span><span class="m" style="font-size:12.5px;color:var(--qm-text-6)">hidden</span></div>
<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:0 18px;padding:11px 0;border-bottom:1px solid var(--qm-border-list)"><span class="m" style="color:var(--qm-text-3)">--qm-meta</span><span class="m" style="font-size:12.5px">block</span><span class="m" style="font-size:12.5px">none</span><span class="m" style="font-size:12.5px;color:var(--qm-text-6)">none</span></div>
<div style="margin-top:12px;color:var(--qm-text-6);line-height:1.6">Set <span class="m" style="color:var(--qm-text-3)">data-qm-density="compact"</span> on any subtree. Density is never a per-component prop.</div></div></body></html>
