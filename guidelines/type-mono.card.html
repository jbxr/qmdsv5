<!-- @dsCard group="Type" viewport="700x190" name="Mono — chronology & signals" subtitle="IBM Plex Mono for story-time, ids, keys and measurements" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--qm-surface-app);font-family:var(--qm-font-sans);color:var(--qm-text-3);font-size:13.5px}*{box-sizing:border-box}.w{padding:16px 18px}.g{display:grid;gap:10px}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.m{font-family:var(--qm-font-mono);font-size:12px;color:var(--qm-text-7)}.lbl{font-family:var(--qm-font-mono);font-size:11px;letter-spacing:.14em;color:var(--qm-text-7)}.sw{width:44px;height:44px;border-radius:8px;border:1px solid var(--qm-border-control-quiet);flex:none}.dot{width:9px;height:9px;flex:none;border-radius:50%}.chip{font-family:var(--qm-font-mono);font-size:12px;border-radius:4px;padding:3px 8px;display:inline-flex;align-items:center;gap:6px}</style>
</head><body><div class="w">
<div class="lbl" style="margin-bottom:12px">IBM PLEX MONO · 400 / 500</div>
<div class="r" style="gap:8px;margin-bottom:12px">
<span class="chip" style="color:#8FCADB;background:var(--qm-tint-blue);border:1px solid var(--qm-border-blue)">Y−6 D1</span>
<span class="chip" style="color:#8FCADB;background:var(--qm-tint-blue);border:1px solid var(--qm-border-blue)">Y35.100</span>
<span class="chip" style="color:var(--qm-text-6);background:var(--qm-fill-chip)">lint 7·5</span>
<span class="chip" style="color:var(--qm-text-6);background:var(--qm-fill-chip)">fn 0.9</span>
<span class="chip" style="color:var(--qm-text-6);background:var(--qm-fill-chip)">run 9c75f6</span>
<span style="font-family:var(--qm-font-mono);font-size:12.5px;min-width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;border-radius:5px;color:var(--qm-text-field);background:var(--qm-fill-hover);border:1px solid var(--qm-border-key);box-shadow:var(--qm-shadow-key)">⌘S</span>
</div>
<div class="m" style="font-size:12.5px;color:var(--qm-text-6)">outline · epigraphs · depth 3 &nbsp;&nbsp; 9 rows · 603 chars · <span style="color:var(--qm-gold)">1 proposed</span></div>
<div style="margin-top:12px;color:var(--qm-text-6);line-height:1.6">Mono floor is 12.5px. Below it, the information moves to hover or selection.</div></div></body></html>
