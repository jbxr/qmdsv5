<!-- @dsCard group="Brand" viewport="700x180" name="Elevation" subtitle="Long, low-opacity black shadows — never a glow, except live state" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--qm-surface-app);font-family:var(--qm-font-sans);color:var(--qm-text-3);font-size:13.5px}*{box-sizing:border-box}.w{padding:16px 18px}.g{display:grid;gap:10px}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.m{font-family:var(--qm-font-mono);font-size:12px;color:var(--qm-text-7)}.lbl{font-family:var(--qm-font-mono);font-size:11px;letter-spacing:.14em;color:var(--qm-text-7)}.sw{width:44px;height:44px;border-radius:8px;border:1px solid var(--qm-border-control-quiet);flex:none}.dot{width:9px;height:9px;flex:none;border-radius:50%}.chip{font-family:var(--qm-font-mono);font-size:12px;border-radius:4px;padding:3px 8px;display:inline-flex;align-items:center;gap:6px}</style>
</head><body><div class="w">
<div class="r" style="gap:14px;align-items:stretch">

<div style="flex:1;padding:14px;border-radius:9px;background:var(--qm-surface-raised);border:1px solid var(--qm-border-panel);box-shadow:var(--qm-shadow-shell)"><div style="color:var(--qm-text-field)">Shell</div><div class="m" style="margin-top:6px;font-size:11px">0 60px 120px -60px</div></div>
<div style="flex:1;padding:14px;border-radius:9px;background:var(--qm-surface-raised);border:1px solid var(--qm-border-panel);box-shadow:var(--qm-shadow-card)"><div style="color:var(--qm-text-field)">Card</div><div class="m" style="margin-top:6px;font-size:11px">0 24px 50px -34px</div></div>
<div style="flex:1;padding:14px;border-radius:9px;background:var(--qm-surface-raised);border:1px solid var(--qm-border-panel);box-shadow:var(--qm-shadow-popover)"><div style="color:var(--qm-text-field)">Popover</div><div class="m" style="margin-top:6px;font-size:11px">0 24px 50px -28px</div></div>
<div style="flex:1;padding:14px;border-radius:9px;background:var(--qm-surface-raised);border:1px solid var(--qm-border-panel);box-shadow:var(--qm-shadow-overlay)"><div style="color:var(--qm-text-field)">Overlay</div><div class="m" style="margin-top:6px;font-size:11px">0 40px 80px -40px</div></div>
</div>
<div class="r" style="gap:16px;margin-top:14px">
<span class="r" style="gap:8px"><span class="dot" style="width:7px;height:7px;background:#55B7A6;box-shadow:0 0 8px #55B7A6"></span><span class="m">live · teal glow</span></span>
<span class="r" style="gap:8px"><span class="dot" style="width:8px;height:8px;background:#E8DCC0;box-shadow:0 0 10px rgba(232,220,192,.6)"></span><span class="m">in scene · parchment glow</span></span>
<span class="r" style="gap:8px"><span class="dot" style="width:8px;height:8px;background:#F17B54;box-shadow:0 0 12px rgba(241,123,84,.5)"></span><span class="m">here · coral glow</span></span>
</div></div></body></html>
