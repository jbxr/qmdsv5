<!-- @dsCard group="Colors" viewport="700x170" name="Surfaces" subtitle="Deep graphite, lit in four steps — never black" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--qm-surface-app);font-family:var(--qm-font-sans);color:var(--qm-text-3);font-size:13.5px}*{box-sizing:border-box}.w{padding:16px 18px}.g{display:grid;gap:10px}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.m{font-family:var(--qm-font-mono);font-size:12px;color:var(--qm-text-7)}.lbl{font-family:var(--qm-font-mono);font-size:11px;letter-spacing:.14em;color:var(--qm-text-7)}.sw{width:44px;height:44px;border-radius:8px;border:1px solid var(--qm-border-control-quiet);flex:none}.dot{width:9px;height:9px;flex:none;border-radius:50%}.chip{font-family:var(--qm-font-mono);font-size:12px;border-radius:4px;padding:3px 8px;display:inline-flex;align-items:center;gap:6px}</style>
</head><body><div class="w">
<div class="r" style="gap:18px">

<div style="display:flex;align-items:center;gap:11px"><span class="sw" style="background:#0E1217"></span><div><div style="color:var(--qm-text-field)">App background</div><div class="m" style="margin-top:3px">#0E1217</div><div class="m">deep graphite, never black</div></div></div>
<div style="display:flex;align-items:center;gap:11px"><span class="sw" style="background:#141A21"></span><div><div style="color:var(--qm-text-field)">Rails & inspector</div><div class="m" style="margin-top:3px">#141A21</div><div class="m">warmer panel surface</div></div></div>
<div style="display:flex;align-items:center;gap:11px"><span class="sw" style="background:#1B242E"></span><div><div style="color:var(--qm-text-field)">Active content</div><div class="m" style="margin-top:3px">#1B242E</div><div class="m">raised, lit</div></div></div>
<div style="display:flex;align-items:center;gap:11px"><span class="sw" style="background:#232C38"></span><div><div style="color:var(--qm-text-field)">Selected beat</div><div class="m" style="margin-top:3px">#232C38</div><div class="m">highest, blue cast</div></div></div>
</div></div></body></html>
