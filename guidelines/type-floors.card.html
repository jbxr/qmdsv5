<!-- @dsCard group="Type" viewport="700x190" name="Floors" subtitle="Size and contrast floors, and what happens below them" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--qm-surface-app);font-family:var(--qm-font-sans);color:var(--qm-text-3);font-size:13.5px}*{box-sizing:border-box}.w{padding:16px 18px}.g{display:grid;gap:10px}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.m{font-family:var(--qm-font-mono);font-size:12px;color:var(--qm-text-7)}.lbl{font-family:var(--qm-font-mono);font-size:11px;letter-spacing:.14em;color:var(--qm-text-7)}.sw{width:44px;height:44px;border-radius:8px;border:1px solid var(--qm-border-control-quiet);flex:none}.dot{width:9px;height:9px;flex:none;border-radius:50%}.chip{font-family:var(--qm-font-mono);font-size:12px;border-radius:4px;padding:3px 8px;display:inline-flex;align-items:center;gap:6px}</style>
</head><body><div class="w">
<div class="r" style="gap:14px;align-items:stretch">
<div style="flex:1;padding:12px 14px;border-radius:8px;background:var(--qm-surface-raised);border:1px solid var(--qm-border-panel)"><div class="lbl">SIZE FLOOR</div><div style="margin-top:8px;line-height:1.6;color:var(--qm-text-4)">14px sans body and rows · 12.5px mono chronology and module labels.</div></div>
<div style="flex:1;padding:12px 14px;border-radius:8px;background:var(--qm-surface-raised);border:1px solid var(--qm-border-panel)"><div class="lbl">CONTRAST FLOOR</div><div style="margin-top:8px;line-height:1.6;color:var(--qm-text-4)">≥ 4.5:1 against its own surface. Disabled and decorative rules exempt.</div></div>
<div style="flex:1;padding:12px 14px;border-radius:8px;background:var(--qm-fill-quiet);border:1px dashed var(--qm-border-dashed)"><div class="lbl">BELOW THE FLOOR</div><div style="margin-top:8px;line-height:1.6;color:var(--qm-text-6)">The information moves to hover or selection — it is never shrunk or dimmed further.</div></div>
</div></div></body></html>
