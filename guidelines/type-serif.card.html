<style>html,body{margin:0;background:var(--qm-surface-app);font-family:var(--qm-font-sans);color:var(--qm-text-3);font-size:13.5px}*{box-sizing:border-box}.w{padding:16px 18px}.g{display:grid;gap:10px}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.m{font-family:var(--qm-font-mono);font-size:12px;color:var(--qm-text-7)}.lbl{font-family:var(--qm-font-mono);font-size:11px;letter-spacing:.14em;color:var(--qm-text-7)}.sw{width:44px;height:44px;border-radius:8px;border:1px solid var(--qm-border-control-quiet);flex:none}.dot{width:9px;height:9px;flex:none;border-radius:50%}.chip{font-family:var(--qm-font-mono);font-size:12px;border-radius:4px;padding:3px 8px;display:inline-flex;align-items:center;gap:6px}</style>

<div class="lbl" style="margin-bottom:12px">SPECTRAL · 300 / 400 / italic</div>
<div style="font-family:var(--qm-font-serif);color:var(--qm-prose-1);font-size:26px;line-height:1.35">Sarita Fernandes reads a letter from a prospective student</div>
<div style="font-family:var(--qm-font-serif);color:var(--qm-prose-1);font-size:23px;line-height:1.5;margin-top:12px">The student begins by describing the Artifact as a work of art</div>
<div style="font-family:var(--qm-font-serif);color:var(--qm-prose-3);font-size:18px;line-height:1.65;margin-top:12px">Its patterns and shape played tricks on the mind. It was presumed these were optical illusions.</div>
<div style="font-family:var(--qm-font-serif);font-style:italic;color:var(--qm-text-4);font-size:16.5px;line-height:1.6;margin-top:10px">Note — he is describing the Chrysalis.</div></div></body></html>
