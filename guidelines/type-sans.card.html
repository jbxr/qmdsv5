<!-- @dsCard group="Type" viewport="700x210" name="Sans — the application" subtitle="IBM Plex Sans for every structural and interface string" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--qm-surface-app);font-family:var(--qm-font-sans);color:var(--qm-text-3);font-size:13.5px}*{box-sizing:border-box}.w{padding:16px 18px}.g{display:grid;gap:10px}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.m{font-family:var(--qm-font-mono);font-size:12px;color:var(--qm-text-7)}.lbl{font-family:var(--qm-font-mono);font-size:11px;letter-spacing:.14em;color:var(--qm-text-7)}.sw{width:44px;height:44px;border-radius:8px;border:1px solid var(--qm-border-control-quiet);flex:none}.dot{width:9px;height:9px;flex:none;border-radius:50%}.chip{font-family:var(--qm-font-mono);font-size:12px;border-radius:4px;padding:3px 8px;display:inline-flex;align-items:center;gap:6px}</style>
</head><body><div class="w">
<div class="lbl" style="margin-bottom:12px">IBM PLEX SANS · 400 / 500 / 600</div>
<div class="g" style="gap:9px">
<div style="font-size:14.5px;color:var(--qm-text-2)">14.5 — inspector fields and body <span class="m">/1.5</span></div>
<div style="font-size:14px;color:var(--qm-text-3)">14 — timeline rows and list text <span class="m">/1.5 · the persistent floor</span></div>
<div style="font-size:13.5px;color:var(--qm-text-4)">13.5 — secondary copy and controls <span class="m">/1.6</span></div>
<div style="font-size:13px;color:var(--qm-text-6)">13 — field labels <span class="m">/1.4</span></div>
<div style="font-size:12.5px;font-weight:600;letter-spacing:.16em;color:var(--qm-text-row)">12.5 SEMIBOLD 0.16EM — MODULE LABELS</div>
</div></div></body></html>
