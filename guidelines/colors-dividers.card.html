<!-- @dsCard group="Colors" viewport="700x170" name="Divider hierarchy" subtitle="Four weights of white — structural, group, list, ancestry" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--qm-surface-app);font-family:var(--qm-font-sans);color:var(--qm-text-3);font-size:13.5px}*{box-sizing:border-box}.w{padding:16px 18px}.g{display:grid;gap:10px}.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.m{font-family:var(--qm-font-mono);font-size:12px;color:var(--qm-text-7)}.lbl{font-family:var(--qm-font-mono);font-size:11px;letter-spacing:.14em;color:var(--qm-text-7)}.sw{width:44px;height:44px;border-radius:8px;border:1px solid var(--qm-border-control-quiet);flex:none}.dot{width:9px;height:9px;flex:none;border-radius:50%}.chip{font-family:var(--qm-font-mono);font-size:12px;border-radius:4px;padding:3px 8px;display:inline-flex;align-items:center;gap:6px}</style>
</head><body><div class="w">
<div class="g">

<div><div style="display:flex;justify-content:space-between;margin-bottom:6px;color:var(--qm-text-4)"><span>Structural (panel edges)</span><span class="m">rgba(255,255,255,0.09)</span></div><div style="height:1px;background:rgba(255,255,255,0.09)"></div></div>
<div><div style="display:flex;justify-content:space-between;margin-bottom:6px;color:var(--qm-text-4)"><span>Group (section rules)</span><span class="m">rgba(255,255,255,0.07)</span></div><div style="height:1px;background:rgba(255,255,255,0.07)"></div></div>
<div><div style="display:flex;justify-content:space-between;margin-bottom:6px;color:var(--qm-text-4)"><span>List (row separators)</span><span class="m">rgba(255,255,255,0.05)</span></div><div style="height:1px;background:rgba(255,255,255,0.05)"></div></div>
<div><div style="display:flex;justify-content:space-between;margin-bottom:6px;color:var(--qm-text-4)"><span>Ancestry (tree connectors)</span><span class="m">rgba(255,255,255,0.12)</span></div><div style="height:1px;background:rgba(255,255,255,0.12)"></div></div>
</div>
<div style="margin-top:12px;color:var(--qm-text-6)">A dashed hairline is never decorative — it means unknown, unparsed or local-only.</div></div></body></html>
