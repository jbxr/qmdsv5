<div class="r" style="gap:0;align-items:stretch">

<div style="flex:1"><div style="height:34px;background:#E9E0CB"></div><div class="m" style="margin-top:6px">scene text</div><div class="m" style="font-size:11px">#E9E0CB</div></div>
